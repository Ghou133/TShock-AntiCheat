name: Public source checks

on:
  push:
    branches: [main, codex/public-audit-20260923]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Public documentation and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test repository checker
        run: python3 -m unittest discover -s tools/repository-checks -p 'test_*.py' -v
      - name: Check generated tables, public links and project boundaries
        run: python3 tools/repository-checks/check_repository.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  tests:
    name: ${{ matrix.project }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: [Core, Rules, Persistence, Progression, RuleExtraction]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - name: Record selected SDK
        run: dotnet --info
      - name: Restore public solution from locked dependencies
        run: dotnet restore AntiCheat.Public.slnf --locked-mode
      - name: Run public tests (not a game-runtime qualification)
        run: dotnet test tests/AntiCheat.${{ matrix.project }}.Tests/AntiCheat.${{ matrix.project }}.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=results.trx" --results-directory TestResults --blame-hang-timeout 3m
      - name: Retain test results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.project }}-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
